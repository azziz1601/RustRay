name: Build RustRay APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust Toolchain for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust SSH Core
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustray-ssh

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build Native SSH Engine (librustray_ssh.so)
        working-directory: rustray-ssh
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 -o ../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode Release Keystore (If Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > rustray-release.jks
            printf "%s\n" "$KEYSTORE_PROPS" > keystore.properties
          fi

      - name: Build Release APKs
        run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease --no-daemon

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: rustray-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
